<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#f8fbff"/>
  <text x="600" y="70" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="42" font-weight="700" fill="#17324d">考研英语阅读细节题流程</text>
  <text x="600" y="115" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#5c6f82">方向比速度更重要：先确定问题方向，再回文验证</text>

  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#2f80ed"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#b4c7dd" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g font-family="Microsoft YaHei, SimHei, sans-serif" filter="url(#shadow)">
    <rect x="80" y="175" rx="22" ry="22" width="300" height="120" fill="#ffffff" stroke="#2f80ed" stroke-width="3"/>
    <text x="230" y="220" text-anchor="middle" font-size="28" font-weight="700" fill="#17324d">1. 先题后文</text>
    <text x="230" y="258" text-anchor="middle" font-size="21" fill="#39566f">只看题干，不急看选项</text>

    <rect x="450" y="175" rx="22" ry="22" width="300" height="120" fill="#ffffff" stroke="#2f80ed" stroke-width="3"/>
    <text x="600" y="220" text-anchor="middle" font-size="28" font-weight="700" fill="#17324d">2. 找定位词</text>
    <text x="600" y="258" text-anchor="middle" font-size="20" fill="#39566f">大写/人名/地名/时间/数字</text>

    <rect x="820" y="175" rx="22" ry="22" width="300" height="120" fill="#ffffff" stroke="#2f80ed" stroke-width="3"/>
    <text x="970" y="220" text-anchor="middle" font-size="28" font-weight="700" fill="#17324d">3. 串联题干</text>
    <text x="970" y="258" text-anchor="middle" font-size="21" fill="#39566f">推测文章主题和走向</text>

    <rect x="820" y="390" rx="22" ry="22" width="300" height="120" fill="#ffffff" stroke="#f2994a" stroke-width="3"/>
    <text x="970" y="435" text-anchor="middle" font-size="28" font-weight="700" fill="#17324d">4. 回文定位</text>
    <text x="970" y="473" text-anchor="middle" font-size="21" fill="#39566f">观点细读，例子略读</text>

    <rect x="450" y="390" rx="22" ry="22" width="300" height="120" fill="#ffffff" stroke="#f2994a" stroke-width="3"/>
    <text x="600" y="435" text-anchor="middle" font-size="28" font-weight="700" fill="#17324d">5. 抓逻辑</text>
    <text x="600" y="473" text-anchor="middle" font-size="21" fill="#39566f">态度词、转折、因果、解释</text>

    <rect x="80" y="390" rx="22" ry="22" width="300" height="120" fill="#ffffff" stroke="#f2994a" stroke-width="3"/>
    <text x="230" y="435" text-anchor="middle" font-size="28" font-weight="700" fill="#17324d">6. 排除干扰</text>
    <text x="230" y="473" text-anchor="middle" font-size="21" fill="#39566f">偷换/嫁接/绝对/反向</text>

    <rect x="290" y="625" rx="26" ry="26" width="620" height="135" fill="#eaf3ff" stroke="#2f80ed" stroke-width="4"/>
    <text x="600" y="675" text-anchor="middle" font-size="30" font-weight="700" fill="#17324d">正确答案特征</text>
    <text x="600" y="718" text-anchor="middle" font-size="23" fill="#39566f">同义改写 · 贴近中心 · 语气缓和</text>
  </g>

  <g stroke="#2f80ed" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M380 235 H435"/>
    <path d="M750 235 H805"/>
    <path d="M970 295 V375"/>
    <path d="M820 450 H765"/>
    <path d="M450 450 H395"/>
    <path d="M230 510 C230 590 330 645 420 675"/>
    <path d="M600 510 V610"/>
    <path d="M970 510 C970 590 870 645 780 675"/>
  </g>

  <g font-family="Microsoft YaHei, SimHei, sans-serif">
    <rect x="88" y="800" rx="16" ry="16" width="1024" height="50" fill="#fff4e6" stroke="#f2994a"/>
    <text x="600" y="833" text-anchor="middle" font-size="22" fill="#8a4d12">口诀：题干定方向 → 定位找依据 → 逻辑判答案</text>
  </g>
</svg>
